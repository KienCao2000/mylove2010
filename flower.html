    <main class="greeting-scene" aria-label="Lời chúc ngày Phụ nữ Việt Nam">
      <header class="greeting-heading">
        <h1>Một chút thương, gửi em</h1>
        <p>Chạm vào từng video để nhận lời chúc nhé.</p>
      </header>

      <div class="memory-video video-one">
        <button class="video-card" data-greeting="left" aria-label="Xem video em và hoa, cùng lời chúc" aria-haspopup="dialog" aria-controls="greeting-dialog">
          <video src="https://nestjs-ecommerce-kiendev.s3.ap-southeast-1.amazonaws.com/em1.mp4" poster="https://nestjs-ecommerce-kiendev.s3.ap-southeast-1.amazonaws.com/em1-poster.jpg" width="720" height="720" muted loop playsinline preload="metadata" tabindex="-1" aria-hidden="true"></video>
          <span>Em và hoa</span>
        </button>
      </div>

      <section class="letter-station" aria-label="Phong thư dành cho em">
        <button class="envelope-button" data-greeting="letter" aria-label="Mở thư chúc mừng ngày 20 tháng 10" aria-haspopup="dialog" aria-controls="greeting-dialog">
          <span class="envelope-art" aria-hidden="true">
            <span class="mail-back"></span>
            <span class="mail-card">
              <span class="mail-card-title">Happy<br>Women's<br>Day</span>
              <span class="mail-card-date">20 · 10</span>
            </span>
            <span class="mail-fold-right"></span>
            <span class="mail-fold-left"></span>
            <span class="mail-hearts"><i>♥</i><i>♥</i><i>♥</i><i>♥</i><i>♥</i></span>
          </span>
          <span class="mail-shadow" aria-hidden="true"></span>
        </button>
        <button class="letter-action" data-greeting="letter" aria-haspopup="dialog" aria-controls="greeting-dialog">Mở thư gửi em</button>
        <p class="letter-hint">Một lời chúc, thật nhiều yêu thương.</p>
      </section>

      <div class="memory-video video-two">
        <button class="video-card" data-greeting="right" aria-label="Xem video một chút đáng yêu, cùng lời chúc" aria-haspopup="dialog" aria-controls="greeting-dialog">
          <video src="https://nestjs-ecommerce-kiendev.s3.ap-southeast-1.amazonaws.com/em2.mp4" poster="https://nestjs-ecommerce-kiendev.s3.ap-southeast-1.amazonaws.com/em2-poster.jpg" width="720" height="720" muted loop playsinline preload="metadata" tabindex="-1" aria-hidden="true"></video>

        </button>
      </div>
      <div class="memory-video video-three">

        </button>
      </div>
    </main>

    <dialog id="greeting-dialog" class="greeting-dialog" aria-labelledby="greeting-title" aria-describedby="greeting-message">
      <div class="dialog-toolbar">
        <button class="dialog-close" aria-label="Đóng lời chúc" autofocus>×</button>
      </div>
      <div class="dialog-content">
        <video class="dialog-video" controls playsinline loop muted preload="metadata" aria-label="Video kỷ niệm của em" hidden></video>
        <h2 id="greeting-title"></h2>
        <button class="reveal-message" type="button" hidden>Chạm để xem hết lời chúc</button>
        <p id="greeting-message" class="dialog-message"><span class="message-layout" aria-hidden="true"></span><span class="message-typed" aria-hidden="true"></span><span class="message-accessible"></span></p>
        <p class="dialog-signature">Thương em thật nhiều ♡</p>
      </div>
    </dialog>
